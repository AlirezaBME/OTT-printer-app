name: Publish verified candidate assets
on:
  push:
    branches: ['release-assets/1.1.0-rc5']
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify published bytes
        working-directory: candidate-assets
        run: sha256sum -c SHA256SUMS.txt
      - name: Attach verified packages and evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v1.1.0-rc5 candidate-assets/* --clobber
