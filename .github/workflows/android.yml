name: Android checks and artifacts
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  canon-reference:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: canon-android-jobs
          path: ${{ runner.temp }}/canon-android-jobs
      - name: Install offline reference harness dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ghostscript libcups2-dev gcc
      - name: Verify SLIM vectors through Canon's decoder
        run: python3 tools/canon/reference_driver.py verify-slim --work-dir "$RUNNER_TEMP/canon-reference"
      - name: Generate NCAP PDL reference without a printer session
        run: python3 tools/canon/reference_driver.py generate --work-dir "$RUNNER_TEMP/canon-reference"
      - name: Compare CPCA messages and NCAP framing against the official driver
        run: python3 tools/canon/reference_driver.py verify-protocol --work-dir "$RUNNER_TEMP/canon-reference"
      - name: Verify actual Canon transport selection and USB MLP packets
        run: python3 tools/canon/reference_driver.py verify-mlp --work-dir "$RUNNER_TEMP/canon-reference"
      - name: Decode complete Android Canon jobs and compare every pixel
        run: python3 tools/canon/reference_driver.py verify-jobs --work-dir "$RUNNER_TEMP/canon-reference" --jobs-dir "$RUNNER_TEMP/canon-android-jobs"
      - uses: actions/upload-artifact@v4
        with:
          name: canon-reference-results
          path: |
            ${{ runner.temp }}/canon-reference/slim-oracle-results.json
            ${{ runner.temp }}/canon-reference/reference-manifest.json
            ${{ runner.temp }}/canon-reference/reference-ncap-pdl.prn
            ${{ runner.temp }}/canon-reference/reference-cpca-job.prn
            ${{ runner.temp }}/canon-reference/cpca-write-calls.tsv
            ${{ runner.temp }}/canon-reference/protocol-oracle-results.json
            ${{ runner.temp }}/canon-reference/mlp-oracle-results.json
            ${{ runner.temp }}/canon-reference/mlp-selection.log
            ${{ runner.temp }}/canon-reference/android-jobs-oracle-results.json
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleDebug :app:assembleRelease :app:bundleRelease
        env:
          CANON_JOB_OUTPUT: ${{ runner.temp }}/canon-android-jobs
      - uses: actions/upload-artifact@v4
        with:
          name: canon-android-jobs
          path: ${{ runner.temp }}/canon-android-jobs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
      - uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
